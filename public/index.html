<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le Mur</title>
  <meta name="description" content="Mes écoutes récentes affichées sur le mur de ma chambre, en 3D">
  <meta name="theme-color" content="#8f9a85">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a7b39b'/%3E%3Crect x='5' y='6' width='13' height='17' fill='%23b4572f' transform='rotate(-7 11 14)'/%3E%3Crect x='14' y='9' width='13' height='17' fill='%23f6f3ed' transform='rotate(6 20 17)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- three.js est servi par notre propre serveur -->
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/addons/": "/vendor/three-addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="room" aria-label="Le mur de ma chambre, couvert d'affiches de mes albums écoutés récemment"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div id="message" class="message" role="status" hidden>
    <p id="messageText"></p>
    <button id="retry" type="button" hidden>Réessayer</button>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <form id="userForm" class="user-form" autocomplete="off">
    <label class="sr-only" for="userInput">Pseudo Last.fm</label>
    <input id="userInput" name="user" placeholder="pseudo Last.fm" spellcheck="false" maxlength="15">
    <button type="submit" aria-label="Voir le mur de ce pseudo">Voir</button>
  </form>

  <div id="banner" class="banner" role="status" hidden></div>

  <!-- Liste lisible au clavier / lecteur d'écran (la 3D n'est pas accessible seule) -->
  <nav class="sr-only" aria-label="Albums affichés sur le mur"><ul id="srList"></ul></nav>

  <dialog id="detail" class="detail">
    <button class="close" type="button" aria-label="Fermer">✕</button>
    <div id="detailBody"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
