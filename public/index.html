<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le Mur</title>
  <meta name="description" content="Mes écoutes récentes encadrées sur le mur de ma chambre">
  <meta name="theme-color" content="#a7b39b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a7b39b'/%3E%3Crect x='7' y='6' width='18' height='20' fill='%231b1a18'/%3E%3Crect x='9.5' y='8.5' width='13' height='15' fill='%23f6f3ed'/%3E%3Crect x='11.5' y='10.5' width='9' height='9' fill='%23b4572f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Space+Mono:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Le sol, sur toute la largeur de l'écran (sa hauteur est calée par app.js) -->
  <div id="floorBand" class="floor-band" aria-hidden="true">
    <div class="plinth"></div>
    <div class="parquet"></div>
  </div>

  <!-- La scène : dessinée à taille fixe, puis mise à l'échelle pour tenir dans l'écran -->
  <div id="stage" class="stage">
    <div id="sunlight" class="sunlight" aria-hidden="true">
      <svg viewBox="0 0 700 560">
        <defs>
          <filter id="sunBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
          <mask id="windowMask">
            <polygon points="150,30 610,80 650,520 110,480" fill="#fff"/>
            <line x1="380" y1="55" x2="382" y2="500" stroke="#000" stroke-width="16"/>
            <line x1="130" y1="255" x2="630" y2="300" stroke="#000" stroke-width="14"/>
            <g class="leaves" fill="#000" stroke="#000">
              <path d="M720 600 Q600 450 470 320" fill="none" stroke-width="7"/>
              <path d="M640 520 Q610 470 600 350" fill="none" stroke-width="4"/>
              <ellipse cx="640" cy="500" rx="70" ry="26" transform="rotate(-30 640 500)"/>
              <ellipse cx="590" cy="430" rx="80" ry="30" transform="rotate(-55 590 430)"/>
              <ellipse cx="520" cy="368" rx="92" ry="40" transform="rotate(-22 520 368)"/>
              <ellipse cx="468" cy="318" rx="72" ry="34" transform="rotate(-68 468 318)"/>
              <ellipse cx="602" cy="346" rx="56" ry="22" transform="rotate(-82 602 346)"/>
            </g>
          </mask>
        </defs>
        <g filter="url(#sunBlur)"><rect width="700" height="560" fill="#fff4d6" mask="url(#windowMask)"/></g>
      </svg>
    </div>

    <div id="sign" class="sign"><h1 id="title" class="neon">Le mur</h1></div>
    <p id="subtitle" class="postit"></p>

    <div id="gallery" class="gallery" aria-label="Albums écoutés récemment, encadrés"></div>
    <div id="message" class="message" role="status" hidden>
      <p id="messageText"></p>
      <button id="retry" type="button" hidden>Réessayer</button>
    </div>

    <!-- Le lit, les chevets, la platine, la plante et le tapis -->
    <svg id="bed" class="bed" viewBox="0 0 1400 560" aria-hidden="true">
      <defs>
        <filter id="b10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="b4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="b1"><feGaussianBlur stdDeviation="1.2"/></filter>

        <!-- velours rouille de la tête de lit -->
        <linearGradient id="velvet" x1="0" x2="1">
          <stop offset="0" stop-color="#6a2f17"/>
          <stop offset=".28" stop-color="#a6522c"/>
          <stop offset=".5" stop-color="#c06a40"/>
          <stop offset=".72" stop-color="#a6522c"/>
          <stop offset="1" stop-color="#622a14"/>
        </linearGradient>
        <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
          <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".28"/>
        </linearGradient>

        <!-- linge de lit -->
        <linearGradient id="duvetTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f3ece1"/>
          <stop offset=".5" stop-color="#fbf8f3"/>
          <stop offset="1" stop-color="#ece6dc"/>
        </linearGradient>
        <linearGradient id="duvetFront" x1="0" x2="1">
          <stop offset="0" stop-color="#d8d0c3"/>
          <stop offset=".07" stop-color="#f3eee6"/>
          <stop offset=".18" stop-color="#e5ded3"/>
          <stop offset=".32" stop-color="#f6f2ec"/>
          <stop offset=".5" stop-color="#e9e3d9"/>
          <stop offset=".66" stop-color="#f6f2ec"/>
          <stop offset=".82" stop-color="#e3dcd0"/>
          <stop offset=".94" stop-color="#f1ece4"/>
          <stop offset="1" stop-color="#d4ccbe"/>
        </linearGradient>
        <linearGradient id="vShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".12"/>
          <stop offset=".35" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".18"/>
        </linearGradient>
        <radialGradient id="pillowW" cx=".5" cy=".4" r=".68">
          <stop offset="0" stop-color="#fffdf9"/>
          <stop offset=".7" stop-color="#f1ebe1"/>
          <stop offset="1" stop-color="#d3cabb"/>
        </radialGradient>
        <radialGradient id="pillowS" cx=".5" cy=".4" r=".7">
          <stop offset="0" stop-color="#eadfcb"/>
          <stop offset=".75" stop-color="#d9c8ab"/>
          <stop offset="1" stop-color="#b9a27f"/>
        </radialGradient>
        <radialGradient id="pillowR" cx=".45" cy=".35" r=".75">
          <stop offset="0" stop-color="#d07a4f"/>
          <stop offset=".7" stop-color="#a6522c"/>
          <stop offset="1" stop-color="#6e3219"/>
        </radialGradient>
        <pattern id="linen" width="5" height="5" patternUnits="userSpaceOnUse">
          <path d="M0 2.5 H5 M2.5 0 V5" stroke="#000" stroke-opacity=".05" stroke-width="1"/>
        </pattern>
        <pattern id="throwStripes" width="40" height="10" patternUnits="userSpaceOnUse">
          <rect width="40" height="10" fill="#d9c9a8"/>
          <rect x="30" width="4" height="10" fill="#c3ae86"/>
          <rect x="36" width="1.5" height="10" fill="#a6522c" opacity=".55"/>
        </pattern>

        <!-- bois clair des chevets -->
        <linearGradient id="oak" x1="0" x2="1">
          <stop offset="0" stop-color="#b48a5e"/>
          <stop offset=".5" stop-color="#d1aa7d"/>
          <stop offset="1" stop-color="#a87e52"/>
        </linearGradient>
        <linearGradient id="oakTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e4c398"/>
          <stop offset="1" stop-color="#c79f72"/>
        </linearGradient>
        <!-- lampe -->
        <radialGradient id="lampGlow">
          <stop offset="0" stop-color="#ffdca6" stop-opacity=".8"/>
          <stop offset=".35" stop-color="#ffd290" stop-opacity=".28"/>
          <stop offset="1" stop-color="#ffd290" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shade" x1="0" x2="1">
          <stop offset="0" stop-color="#e9dcc3"/>
          <stop offset=".5" stop-color="#fff3dc"/>
          <stop offset="1" stop-color="#e2d2b5"/>
        </linearGradient>
        <pattern id="pleats" width="8" height="10" patternUnits="userSpaceOnUse">
          <path d="M4 0 V10" stroke="#b9a684" stroke-opacity=".45" stroke-width="1.4"/>
        </pattern>
        <radialGradient id="ceramic" cx=".38" cy=".32" r=".75">
          <stop offset="0" stop-color="#fbf7ef"/>
          <stop offset=".7" stop-color="#ddd3c2"/>
          <stop offset="1" stop-color="#b9ad98"/>
        </radialGradient>
        <!-- plante -->
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5d8a55"/>
          <stop offset="1" stop-color="#2f5530"/>
        </linearGradient>
        <linearGradient id="pot" x1="0" x2="1">
          <stop offset="0" stop-color="#d9d2c6"/>
          <stop offset=".45" stop-color="#f4efe6"/>
          <stop offset="1" stop-color="#b9b0a2"/>
        </linearGradient>
        <!-- tapis en jute -->
        <pattern id="jute" width="10" height="6" patternUnits="userSpaceOnUse">
          <rect width="10" height="6" fill="#cdb48a"/>
          <path d="M0 3 Q2.5 0 5 3 T10 3" stroke="#b39566" stroke-width="1.6" fill="none"/>
        </pattern>
        <clipPath id="sleeveClip"><rect x="0" y="0" width="120" height="120" rx="2"/></clipPath>
      </defs>

      <!-- tapis -->
      <polygon points="250,470 1150,470 1290,556 110,556" fill="url(#jute)"/>
      <polygon points="250,470 1150,470 1290,556 110,556" fill="none" stroke="#a88a5c" stroke-width="5" opacity=".7"/>
      <polygon points="250,470 1150,470 1290,556 110,556" fill="url(#vShade)" opacity=".6"/>

      <!-- ombres au sol -->
      <ellipse cx="700" cy="492" rx="390" ry="18" fill="#1b130b" opacity=".45" filter="url(#b10)"/>
      <ellipse cx="260" cy="494" rx="100" ry="9" fill="#1b130b" opacity=".4" filter="url(#b4)"/>
      <ellipse cx="1140" cy="494" rx="100" ry="9" fill="#1b130b" opacity=".4" filter="url(#b4)"/>
      <ellipse cx="1325" cy="496" rx="55" ry="8" fill="#1b130b" opacity=".4" filter="url(#b4)"/>

      <!-- ombre de la tête de lit sur le mur -->
      <rect x="402" y="112" width="620" height="230" rx="22" fill="#14201a" opacity=".32" filter="url(#b10)"/>

      <!-- tête de lit courte, capitonnée en lés verticaux -->
      <g>
        <rect x="390" y="100" width="620" height="240" rx="22" fill="#5c2813"/>
        <g id="lez">
          <rect x="392" y="102" width="60" height="236" rx="20" fill="url(#velvet)"/>
        </g>
        <use href="#lez" x="62"/><use href="#lez" x="124"/><use href="#lez" x="186"/><use href="#lez" x="248"/>
        <use href="#lez" x="310"/><use href="#lez" x="372"/><use href="#lez" x="434"/><use href="#lez" x="496"/><use href="#lez" x="558"/>
        <rect x="390" y="100" width="620" height="240" rx="22" fill="url(#topLight)"/>
      </g>

      <!-- sommier tapissé + pieds -->
      <rect x="372" y="438" width="656" height="38" rx="6" fill="url(#velvet)"/>
      <rect x="372" y="438" width="656" height="38" rx="6" fill="url(#vShade)"/>
      <rect x="392" y="474" width="14" height="18" rx="2" fill="#3b2617"/>
      <rect x="994" y="474" width="14" height="18" rx="2" fill="#3b2617"/>

      <!-- dessus du lit en perspective + drap retourné -->
      <polygon points="404,300 996,300 1032,374 368,374" fill="url(#duvetTop)"/>
      <polygon points="404,300 996,300 1032,374 368,374" fill="url(#linen)"/>
      <path d="M470 352 Q560 344 650 356 M760 348 Q850 340 940 352" stroke="#d6cdbf" stroke-width="2" fill="none" filter="url(#b1)"/>

      <!-- oreillers -->
      <ellipse cx="700" cy="318" rx="300" ry="14" fill="#000" opacity=".16" filter="url(#b4)"/>
      <rect x="420" y="206" width="272" height="108" rx="38" fill="url(#pillowW)"/>
      <rect x="708" y="206" width="272" height="108" rx="38" fill="url(#pillowW)"/>
      <rect x="458" y="246" width="200" height="80" rx="26" fill="url(#pillowS)"/>
      <rect x="742" y="246" width="200" height="80" rx="26" fill="url(#pillowS)"/>
      <rect x="458" y="246" width="200" height="80" rx="26" fill="url(#linen)"/>
      <rect x="742" y="246" width="200" height="80" rx="26" fill="url(#linen)"/>
      <rect x="624" y="276" width="152" height="54" rx="24" fill="url(#pillowR)"/>
      <polygon points="402,300 998,300 1002,318 398,318" fill="#fdfbf7"/>
      <line x1="398" y1="319" x2="1002" y2="319" stroke="#cfc6b7" stroke-width="2" filter="url(#b1)"/>

      <!-- plaid plié au pied du lit -->
      <polygon points="384,340 1016,340 1032,374 368,374" fill="url(#throwStripes)"/>
      <polygon points="384,340 1016,340 1032,374 368,374" fill="url(#vShade)" opacity=".5"/>

      <!-- tombant de la couette, puis du plaid -->
      <path d="M366 374 H1034 L1038 444 Q960 449 880 445 Q790 451 700 446 Q610 451 520 445 Q440 450 362 444 Z" fill="url(#duvetFront)"/>
      <path d="M366 374 H1034 L1038 444 L362 444 Z" fill="url(#vShade)"/>
      <path d="M368 374 H1032 L1034 414 Q940 420 840 415 Q740 421 640 415 Q540 421 440 415 Q400 418 366 414 Z" fill="url(#throwStripes)"/>
      <path d="M368 374 H1032 L1034 414 L366 414 Z" fill="url(#vShade)" opacity=".8"/>
      <line x1="368" y1="375" x2="1032" y2="375" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>

      <!-- chevet gauche + lampe -->
      <circle cx="255" cy="235" r="240" fill="url(#lampGlow)"/>
      <rect x="170" y="346" width="170" height="124" rx="6" fill="url(#oak)"/>
      <rect x="160" y="332" width="190" height="16" rx="5" fill="url(#oakTop)"/>
      <line x1="176" y1="408" x2="334" y2="408" stroke="#7d5a37" stroke-width="2"/>
      <rect x="236" y="380" width="38" height="5" rx="2.5" fill="#6d4c2e"/>
      <rect x="180" y="468" width="10" height="24" fill="#7d5a37"/>
      <rect x="320" y="468" width="10" height="24" fill="#7d5a37"/>
      <ellipse cx="255" cy="300" rx="34" ry="32" fill="url(#ceramic)"/>
      <rect x="250" y="262" width="10" height="12" fill="#cfc4b1"/>
      <polygon points="196,264 314,264 296,176 214,176" fill="url(#shade)"/>
      <polygon points="196,264 314,264 296,176 214,176" fill="url(#pleats)"/>
      <ellipse cx="255" cy="264" rx="59" ry="5" fill="#fff4d8"/>
      <rect x="292" y="320" width="44" height="7" rx="1" fill="#2f5d73"/>
      <rect x="296" y="313" width="38" height="7" rx="1" fill="#c9a34a"/>

      <!-- chevet droit + platine vinyle -->
      <rect x="1060" y="346" width="170" height="124" rx="6" fill="url(#oak)"/>
      <rect x="1050" y="332" width="190" height="16" rx="5" fill="url(#oakTop)"/>
      <line x1="1066" y1="408" x2="1224" y2="408" stroke="#7d5a37" stroke-width="2"/>
      <rect x="1126" y="380" width="38" height="5" rx="2.5" fill="#6d4c2e"/>
      <rect x="1070" y="468" width="10" height="24" fill="#7d5a37"/>
      <rect x="1210" y="468" width="10" height="24" fill="#7d5a37"/>
      <rect x="1068" y="304" width="156" height="30" rx="4" fill="#3a2a1d"/>
      <rect x="1068" y="304" width="156" height="8" rx="3" fill="#57412e"/>
      <ellipse cx="1136" cy="306" rx="56" ry="11" fill="#121212"/>
      <ellipse cx="1136" cy="305" rx="46" ry="8.5" fill="none" stroke="#2c2c2c" stroke-width="1"/>
      <ellipse cx="1136" cy="305" rx="34" ry="6.5" fill="none" stroke="#2c2c2c" stroke-width="1"/>
      <ellipse id="vinylLabel" cx="1136" cy="306" rx="15" ry="3.4" style="fill: var(--now-color, #b4572f)"/>
      <path d="M1208 300 L1206 312 L1168 314" stroke="#c9c9c9" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="1208" cy="300" r="5" fill="#9a9a9a"/>

      <!-- pochette du disque en cours, posée contre le chevet gauche -->
      <g transform="translate(46 372) rotate(-7)">
        <rect x="4" y="6" width="120" height="120" fill="#000" opacity=".35" filter="url(#b4)"/>
        <rect width="120" height="120" fill="#e9e2d6"/>
        <image id="sleeveImg" width="120" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#sleeveClip)"/>
        <rect width="120" height="120" fill="url(#vShade)" opacity=".6"/>
      </g>

      <!-- plante en pot dans le coin -->
      <g>
        <path d="M1325 420 Q1300 300 1250 190" stroke="#4b6b3f" stroke-width="4" fill="none"/>
        <path d="M1328 420 Q1340 280 1320 140" stroke="#4b6b3f" stroke-width="4" fill="none"/>
        <path d="M1330 420 Q1370 310 1385 200" stroke="#4b6b3f" stroke-width="4" fill="none"/>
        <ellipse cx="1248" cy="186" rx="26" ry="44" transform="rotate(-38 1248 186)" fill="url(#leaf)"/>
        <ellipse cx="1286" cy="250" rx="24" ry="40" transform="rotate(-62 1286 250)" fill="url(#leaf)"/>
        <ellipse cx="1318" cy="132" rx="26" ry="46" transform="rotate(-6 1318 132)" fill="url(#leaf)"/>
        <ellipse cx="1342" cy="214" rx="22" ry="38" transform="rotate(28 1342 214)" fill="url(#leaf)"/>
        <ellipse cx="1384" cy="192" rx="24" ry="42" transform="rotate(20 1384 192)" fill="url(#leaf)"/>
        <ellipse cx="1300" cy="320" rx="22" ry="36" transform="rotate(-48 1300 320)" fill="url(#leaf)"/>
        <ellipse cx="1360" cy="296" rx="22" ry="36" transform="rotate(44 1360 296)" fill="url(#leaf)"/>
      </g>
      <path d="M1286 410 H1366 L1358 494 H1294 Z" fill="url(#pot)"/>
      <ellipse cx="1326" cy="410" rx="40" ry="6" fill="#5a4535"/>
    </svg>
  </div>

  <form id="userForm" class="user-form" autocomplete="off">
    <label class="sr-only" for="userInput">Pseudo Last.fm</label>
    <input id="userInput" name="user" placeholder="pseudo Last.fm" spellcheck="false" maxlength="15">
    <button type="submit" aria-label="Voir le mur de ce pseudo">Voir</button>
  </form>

  <div id="banner" class="banner" role="status" hidden></div>

  <dialog id="detail" class="detail">
    <button class="close" type="button" aria-label="Fermer">✕</button>
    <div id="detailBody"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
